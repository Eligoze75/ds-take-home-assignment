version: 2

models:
  - name: dim_item
    description: One row per catalog item.
    columns:
      - name: item_id
        tests: [unique, not_null]
      - name: search_text
        tests: [not_null]

  - name: dim_vendor
    description: One row per vendor that has received a purchase order.
    columns:
      - name: vendor_id
        tests: [unique, not_null]

  - name: dim_customer
    description: One row per customer (tenant) with first / last order dates and PO count.
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: fct_purchase_order_line
    description: >
      Purchase order lines with header attributes (customer, vendor, order date, status) attached.
      Grain: one row per PO line. The customer is the one on the purchase order header.
      Exact duplicate lines are collapsed. A line is dropped when it alone explains the gap
      between the header total and the sum of the lines, the item appears only once, and the
      item has no vendor list price.
    columns:
      - name: po_number
        tests: [not_null]
      - name: item_id
        tests: [not_null]
      - name: vendor_id
        tests: [not_null]
      - name: order_date
        tests: [not_null]
      - name: status
        tests:
          - accepted_values:
              values: ['Open', 'Received', 'Closed', 'Cancelled']

  - name: fct_purchase_line
    description: >
      Cleaned purchase lines for every customer, used to train the unit-price model.
      One row per PO line. Same cleaning rules as fct_purchase_order_line, with catalog
      attributes and the header total attached. customer_id is a model input.
    columns:
      - name: po_number
        tests: [not_null]
      - name: item_id
        tests: [not_null]
      - name: customer_id
        tests: [not_null]
      - name: vendor_id
        tests: [not_null]
      - name: order_date
        tests: [not_null]
      - name: quantity_ordered
        tests: [not_null]
      - name: unit_price_paid

  - name: fct_company_a_purchase_line
    description: >
      Company A slice of fct_purchase_line. Same columns, restricted to CUST-A.
    columns:
      - name: po_number
        tests: [not_null]
      - name: item_id
        tests: [not_null]
      - name: customer_id
        tests:
          - not_null
          - accepted_values:
              values: ['CUST-A']
      - name: order_date
        tests: [not_null]
      - name: unit_price_paid

  - name: t1_company_a_opportunity_items
    description: >
      Company A items used for the time-of-year question. One row per item that is bought
      more often than 90% of the catalog, has at least 8 distinct purchase months spanning
      a year, and has total spend above the median item. Cancelled orders are excluded.
      value_of_1pct_price_change is total_spend / 100.
    columns:
      - name: item_id
        tests: [unique, not_null]
      - name: n_orders
        tests: [not_null]
      - name: attachment
        tests: [not_null]
      - name: total_spend
        tests: [not_null]

  - name: t1_baseline_pricing_model
    description: >
      Baseline rolling-median pricing model for Task 1b. Grain: one row per
      (customer_id, item_id, vendor_id, order_date) seen in fct_purchase_line
      (Cancelled orders excluded). Same-day lines are collapsed to a single daily
      price first. rolling_median_price_60d is the median daily price over the
      strictly preceding 60 calendar days for that customer/item/vendor combo
      (the row's own day is never in its own window, so there is no future
      leakage); it expands to whatever prior days exist when there are fewer
      than 60, and is null the first time a combination is seen. 60 days (not 15)
      because at this grain most combos are bought less than every 15 days, which
      left ~89% of rows with no prior history under a 15-day window.
      n_prior_days_with_price is the count of priced days behind that median,
      so 0 means "no prior history, prediction is null."
      To predict a price ahead of a new PO, look up the row with the largest
      order_date <= the target date for that customer/item/vendor.
    columns:
      - name: customer_id
        tests: [not_null]
      - name: item_id
        tests: [not_null]
      - name: vendor_id
        tests: [not_null]
      - name: order_date
        tests: [not_null]
      - name: n_prior_days_with_price
        tests: [not_null]

  - name: item_purchase_history
    description: >
      Legacy aggregate. One row per catalog item: how often it has been purchased, earliest / latest
      purchase dates, and a percentile breakdown of unit price paid. Built from the cleaned
      purchase order lines. Feeds the procurement analytics dashboards.
    columns:
      - name: item_id
        tests: [unique, not_null]
      - name: purchase_frequency
      - name: earliest_purchase_date
      - name: latest_purchase_date
      - name: price_p25
      - name: price_p50
      - name: price_p75
      - name: price_p90
